    <script>
      var tl = gsap.timeline({ paused: true });

      /* Audio-reactive, subtle: RMS breathes the shared glow behind the
         identity card (scene 2) and swells the ground behind the product
         panel (scene 5). Host-level element, so it stays on this timeline —
         a sub-composition timeline cannot reach across the boundary.
         No waveform or equalizer visuals. */
      var glowEl = document.getElementById("glow");

      function applyAudio(frame, t) {
        var rms = frame.rms || 0;
        var gate = 0;
        if (t >= 2.65 && t < 5.6) gate = 1.0;
        else if (t >= 13.2 && t < 17.6) gate = 0.6;
        glowEl.style.opacity = (gate * (0.30 + rms * 0.55)).toFixed(3);
      }

      for (var f = 0; f < AUDIO_DATA.totalFrames; f++) {
        tl.call(
          (function (frame, t) {
            return function () { applyAudio(frame, t); };
          })(AUDIO_DATA.frames[f], f / AUDIO_DATA.fps),
          [],
          f / AUDIO_DATA.fps
        );
      }

      window.__timelines["main"] = tl;
    </script>
